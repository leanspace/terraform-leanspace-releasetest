name: Validate
on:
  pull_request:
  push:
    tags: ["v*.*.*"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # After a tag is pushed the registry ingests it via webhook; confirm it is retrievable.
  smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: hashicorp/setup-terraform@v3
      - name: Wait for registry and init isolated consumer
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fs https://registry.terraform.io/v1/modules/leanspace/releasetest/leanspace/versions \
              | jq -e --arg v "$v" '.modules[0].versions[] | select(.version==$v)' && break
            sleep 20
          done
          mkdir consumer && cd consumer
          printf 'module "a" {\n  source  = "leanspace/releasetest/leanspace//modules/component-a"\n  version = "%s"\n}\n' "$v" > main.tf
          terraform init -backend=false
